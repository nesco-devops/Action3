name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Nom du dépôt d'image Docker Hub"
        required: true
        type: string

      build_context:
        description: "Dossier utilisé comme contexte Docker"
        required: true
        type: string

      dockerfile:
        description: "Chemin du Dockerfile"
        required: true
        type: string

      gitops_manifest:
        description: "Manifeste Deployment à modifier dans 4GitOps"
        required: false
        default: ""
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        required: true

      DOCKERHUB_TOKEN:
        required: true

      GITOPS_TOKEN:
        required: false

jobs:
  build-and-push:
    name: Build and push ${{ inputs.image_name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Préparer Node.js pour le contrôle de sécurité
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la sécurité des dépendances npm
        working-directory: ${{ inputs.build_context }}
        run: npm audit --audit-level=high

      - name: Préparer QEMU
        uses: docker/setup-qemu-action@v3

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Générer les tags Docker
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récupérer le dépôt GitOps
        if: ${{ inputs.gitops_manifest != '' }}
        uses: actions/checkout@v4
        with:
          repository: nesco-devops/4GitOps
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Mettre à jour le tag dans GitOps
        if: ${{ inputs.gitops_manifest != '' }}
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          MANIFEST_PATH: gitops/${{ inputs.gitops_manifest }}
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          NEW_IMAGE="${IMAGE_REPOSITORY}:sha-${SHORT_SHA}"

          if [[ ! -f "${MANIFEST_PATH}" ]]; then
            echo "Manifeste introuvable : ${MANIFEST_PATH}"
            exit 1
          fi

          sed -E -i \
            "s|^([[:space:]]*image:[[:space:]]*).*$|\1${NEW_IMAGE}|" \
            "${MANIFEST_PATH}"

          echo "Nouvelle image : ${NEW_IMAGE}"
          grep -n "image:" "${MANIFEST_PATH}"

      - name: Commit et push vers GitOps
        if: ${{ inputs.gitops_manifest != '' }}
        env:
          MANIFEST_PATH: ${{ inputs.gitops_manifest }}
          IMAGE_NAME: ${{ inputs.image_name }}
        working-directory: gitops
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${MANIFEST_PATH}"

          if git diff --cached --quiet; then
            echo "Le manifeste utilise déjà cette image."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          git commit -m "chore: update ${IMAGE_NAME} to sha-${SHORT_SHA}"

          for ATTEMPT in 1 2 3; do
            git pull --rebase origin main

            if git push origin main; then
              echo "Mise à jour GitOps publiée."
              exit 0
            fi

            echo "Nouvelle tentative de push : ${ATTEMPT}/3"
          done

          echo "Impossible de publier la mise à jour GitOps."
          exit 1
