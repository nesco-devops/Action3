name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Nom du dépôt d'image Docker Hub"
        required: true
        type: string

      build_context:
        description: "Dossier utilisé comme contexte Docker"
        required: true
        type: string

      dockerfile:
        description: "Chemin du Dockerfile"
        required: true
        type: string

    secrets:
      DOCKERHUB_USERNAME:
        required: true

      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    name: Build and push ${{ inputs.image_name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Préparer QEMU
        uses: docker/setup-qemu-action@v3

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Générer les tags Docker
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
